<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8d7b3">
  <title>Hugh Hoford</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="world">
    <canvas id="scene" tabindex="0" aria-label="Interactive atlas. Explore the map and enter Port of Spain using the destination button."></canvas>
    <header><a href="./" id="name">Hugh Hoford</a><span id="place" aria-live="polite"></span></header>
    <nav id="map-tools" aria-label="Map controls">
      <button id="zoom-in" aria-label="Zoom in">+</button>
      <button id="zoom-out" aria-label="Zoom out">−</button>
    </nav>
    <button id="destination">Port of Spain <span aria-hidden="true">↗</span></button>
    <button id="back" hidden><span aria-hidden="true">←</span> Atlas</button>
    <div id="landmark" hidden role="status"></div>
    <p id="loading" role="status">Loading atlas…</p>
    <div id="error" hidden role="alert">The atlas could not load. <button id="retry">Retry</button></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
