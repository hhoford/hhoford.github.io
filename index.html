<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8d7b3">
  <title>Hugh Hoford</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <main id="world">
    <canvas id="scene" tabindex="0" aria-label="Worldwide pixel atlas. Pan and zoom to view 135 GDP-ranked city locations. Select a travel destination to explore."></canvas>
    <header><a href="./" id="name">Hugh Hoford</a><span id="place" aria-live="polite"></span></header>
    <nav id="destinations" aria-label="Travel destinations"></nav>
    <a id="city-credit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" hidden>© OpenStreetMap contributors</a>
    <div id="landmark" hidden role="status"></div>
    <p id="loading" role="status">Loading atlas…</p>
    <div id="error" hidden role="alert">The map could not load. <button id="retry">Retry</button></div>
  </main>
  <script type="module" src="app.js?v=4"></script>
</body>
</html>
