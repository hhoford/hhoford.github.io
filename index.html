<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hugh Jordan Hoford</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fafaf9;
      color: #252525;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    main {
      width: min(52rem, calc(100% - 3rem));
      margin: clamp(3rem, 12vh, 8rem) auto;
    }
    header { padding-bottom: 3rem; }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -.045em;
    }
    section {
      display: grid;
      grid-template-columns: 11rem minmax(0, 1fr);
      gap: 2rem;
      min-height: 10rem;
      padding: 2rem 0;
      border-top: 1px solid #dededb;
    }
    h2 { margin: 0; color: #666; font-size: .85rem; font-weight: 400; }
    .entries { display: grid; align-content: start; gap: 1rem; }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: .25em; }
    a:hover { color: #666; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
    @media (max-width: 560px) {
      header { padding-bottom: 2rem; }
      section { grid-template-columns: 1fr; gap: 1.5rem; min-height: 9rem; }
    }
  </style>
</head>
<body>
  <main>
    <header><h1>Hugh Jordan Hoford</h1></header>
    <section aria-labelledby="projects">
      <h2 id="projects">Projects</h2>
      <div class="entries">
      </div>
    </section>
    <section aria-labelledby="experience">
      <h2 id="experience">Experience</h2>
      <div class="entries">
      </div>
    </section>
    <section aria-labelledby="contact">
      <h2 id="contact">Contact</h2>
      <div class="entries"><a href="https://github.com/hhoford">GitHub</a></div>
    </section>
  </main>
</body>
</html>
